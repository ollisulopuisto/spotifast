name: Release credential transport
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'packaging/macos/**'
      - 'tests/manual/test_macos_keychain_transport.py'
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Portable Ruby transport guards
        run: ruby packaging/macos/test_credential_transport.rb
      - name: Exact pinned gem loader
        run: |
          gem install native-packages --version 0.10.0 --no-document
          ruby packaging/macos/secure_native_packages.rb --help
      - name: Native dummy-keychain transport smoke check
        run: python3 tests/manual/test_keychain_transport.py -v
